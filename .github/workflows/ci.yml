name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.10", "3.11", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install pytest
      - name: Run offline synthetic suite
        # exactly the suite AGENTS.md/CONTRIBUTING call CI-safe:
        # pure synthetic data, no Edge, no network, no real quota
        run: python -m pytest espacenet_cli/tests/test_core.py espacenet_cli/tests/test_budget.py -q
