name: Release to PyPI

# Manual trigger. Build distributions from the current checkout and publish
# them to PyPI via Trusted Publishing (OIDC) — no API token involved.
#
# One-time PyPI side setup (Account settings -> Publishing -> pending
# publisher), which this workflow must match exactly:
#   PyPI project name: espacenet-cli
#   Owner:             Awakeniing
#   Repository:        espacenet-cli
#   Workflow name:     release.yml
#   Environment:       (leave empty)

on:
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write # OIDC identity for PyPI trusted publishing
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
